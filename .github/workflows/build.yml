name: build

# Builds MoonVerb on macOS, Windows and Linux, validates the plug-ins, and packages an installer for each:
#   macOS   MoonVerb-<ver>-macOS.pkg        (VST3 + Audio Unit + standalone, universal arm64/x86_64)
#   Windows MoonVerb-<ver>-Windows.exe      (Inno Setup: VST3 + standalone)
#   Linux   MoonVerb-<ver>-linux-amd64.deb  (and a .tar.gz)
# A tag v* also publishes them as a GitHub release. No firmware is in the repository, so the plug-in tests that need it are skipped here.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests test

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --target MoonVerb_VST3 MoonVerb_AU MoonVerb_Standalone --parallel 4
      - name: Validate (auval, pluginval)
        run: |
          brew install --cask pluginval
          mkdir -p ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          cp -RX build/MoonVerb_artefacts/Release/VST3/MoonVerb.vst3 ~/Library/Audio/Plug-Ins/VST3/
          cp -RX build/MoonVerb_artefacts/Release/AU/MoonVerb.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/VST3/MoonVerb.vst3
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/MoonVerb.component
          /Applications/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process ~/Library/Audio/Plug-Ins/VST3/MoonVerb.vst3
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumf Mvrb Mnte
      - name: Package
        env:
          MOONVERB_CODESIGN_ID: ${{ secrets.MACOS_CODESIGN_ID }}
          MOONVERB_INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: MoonVerb-macOS, path: build/dist/*.pkg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target MoonVerb_VST3 MoonVerb_Standalone --parallel 4
      - name: Validate (pluginval)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          .\pv\pluginval.exe --strictness-level 5 --validate-in-process build/MoonVerb_artefacts/Release/VST3/MoonVerb.vst3
      - name: Package
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path CMakeLists.txt -Pattern '^project\(MoonVerb VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\windows\MoonVerb.iss
      - uses: actions/upload-artifact@v4
        with: { name: MoonVerb-Windows, path: build/dist/*.exe }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target MoonVerb_VST3 MoonVerb_Standalone --parallel 4
      - name: Validate (pluginval)
        continue-on-error: true
        run: |
          curl -sL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip -o pv.zip
          unzip -q pv.zip -d pv && chmod +x pv/pluginval
          xvfb-run -a pv/pluginval --strictness-level 5 --validate-in-process build/MoonVerb_artefacts/Release/VST3/MoonVerb.vst3
      - name: Package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: MoonVerb-Linux, path: "build/dist/*" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Installers for macOS, Windows and Linux. The firmware images are not included: see the manual for the five files MoonVerb needs and how to point it at them.
